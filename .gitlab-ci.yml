stages:
  - build
  - test
  - prettify

variables:
  NODE_VERSION: "18"

default:
  image: node:${NODE_VERSION}
  before_script:
    - npm ci
    - echo "Using Node.js $NODE_VERSION"

build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

test:
  stage: test
  script:
    - echo "Running integration tests..."
    - npm run integration_test
  dependencies:
    - build
  allow_failure: false

prettify:
  stage: prettify
  script:
    - npm run prettier:check
  allow_failure: false
