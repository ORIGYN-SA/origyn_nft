default:
  image: registry.bochslerfinance.com/runners-images/dfinity-canisters:0.22.0@sha256:11730bea35bb5b41aaec9c600a6b7ac837188d21d8d9ce97f781a7b74ad1fd01
  interruptible: true
  before_script:
    - dfx --version

cache:
  - key: "dfx-$CI_COMMIT_REF_SLUG"
    paths:
      - .dfx

stages:
  - build
  - test
  - prettify


build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

test:
  stage: test
  script:
    - echo "Running integration tests..."
    - npm run integration_test
  dependencies:
    - build
  allow_failure: false

prettify:
  stage: prettify
  script:
    - npm run prettier:check
  allow_failure: false
